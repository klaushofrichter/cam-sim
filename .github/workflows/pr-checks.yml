name: PR checks

on:
  pull_request:
    branches: [main, production]

# Least privilege for the PR checks; the codeql job asks for more itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      # ffmpeg generates the test-pattern fixtures (src/media/fixtures.ts).
      - name: Ensure ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Ensure DejaVu fonts (SD pipeline tests)
        run: test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf || (sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core)
      - name: Install MediaMTX (RTSP tests)
        run: |
          p=$(scripts/install-mediamtx.sh "$RUNNER_TEMP/mediamtx")
          echo "CAMSIM_MEDIAMTX=$p" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
      - run: npm run lint:types
      # Blocking: what ships (the image and the npm package), no exceptions.
      - run: npm audit --omit=dev --audit-level=high
      # Blocking too: everything, dev dependencies included, at high. The only
      # exception is the allowlist .github/audit-allowlist.json, by advisory id:
      # GHSA-2p57-rm9w-gvfp (`ip` via ftp-srv, the tests' FTP server; no patched
      # release; approved by Klaus 2026-10-03). The gate also fails when that
      # advisory disappears, changes its range or a new `ip` release appears,
      # so the entry gets removed once it can be (scripts/audit-gate.mjs).
      - name: npm audit (all dependencies, with the allowlist)
        run: |
          set -euo pipefail
          # npm audit exits 1 whenever it finds anything; the gate decides. A
          # failed audit (no report) fails the gate.
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          node scripts/audit-gate.mjs "$RUNNER_TEMP/audit.json"
      # No media may be committed (spec 6.1), except the README screenshots in
      # docs/screenshots/ (PNG only), which Klaus approved.
      - name: No media files in the repository
        run: |
          if git ls-files | grep -Ev '^docs/screenshots/[^/]+\.png$' | grep -Ei '\.(mp4|flv|jpe?g|png|h26[45]|aac|mov|mkv)$'; then
            echo "::error::media files are not allowed in this repository"; exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm ci
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome.list
      - name: Ensure ffmpeg (fixtures)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - name: Ensure DejaVu fonts (SD pipeline tests)
        run: test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf || (sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core)
      - run: npm run build
      - run: npm run check
      # Chrome (not the bundled Chromium): it plays H.264/AAC, as users' browsers do.
      - run: google-chrome --version
      # No trace/screenshot upload: once real footage plays they would carry camera pictures.
      - run: npm run test:e2e
        env:
          CI: 'true'

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the image and checks login, live FLV, an event, Search and Download.
      - run: scripts/container-smoke.sh

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: never
      - name: Fail if CodeQL found any results
        run: |
          set -euo pipefail
          accepted=.github/codeql-accepted.tsv
          blocking=0
          for f in sarif-results/*.sarif; do
            while IFS=$'\t' read -r rule uri line message; do
              [ -n "$rule" ] || continue
              if grep -v '^#' "$accepted" | awk -F'\t' -v r="$rule" -v p="$uri" '$1==r && $2==p {found=1} END {exit !found}'; then
                echo "::notice::CodeQL $rule at $uri:$line — accepted exception, see $accepted"
              else
                echo "::error::CodeQL $rule — $message"
                echo "    at $uri:$line"
                blocking=$((blocking + 1))
              fi
            done < <(jq -r '.runs[].results[]
              | select((.suppressions // []) | length == 0)
              | [.ruleId,
                 .locations[0].physicalLocation.artifactLocation.uri,
                 (.locations[0].physicalLocation.region.startLine | tostring),
                 .message.text] | @tsv' "$f")
          done
          echo "CodeQL blocking findings: $blocking"
          [ "$blocking" -eq 0 ] || { echo "::error::CodeQL found $blocking unaccepted finding(s)"; exit 1; }
